# No values are hard-coded here: every property comes from an environment variable.
# For local development the 'local' profile loads application-local.properties (git-ignored).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.application.name=${SPRING_APPLICATION_NAME}
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL}
spring.ai.openai.chat.options.temperature=${SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE}
spring.ai.openai.embedding.options.model=${SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL}
server.port=${SERVER_PORT}
kite.api-key=${KITE_API_KEY}
kite.api-secret=${KITE_API_SECRET}
kite.redirect-url=${KITE_REDIRECT_URL}
ingestion.fixed-rate-ms=${INGESTION_FIXED_RATE_MS}
ingestion.http-timeout-ms=${INGESTION_HTTP_TIMEOUT_MS}
ingestion.user-agent=${INGESTION_USER_AGENT}
ingestion.screener-base-url=${INGESTION_SCREENER_BASE_URL}
ingestion.screener-session-cookie=${INGESTION_SCREENER_SESSION_COOKIE}
ingestion.max-concurrency=${INGESTION_MAX_CONCURRENCY}
ingestion.chunk-size=${INGESTION_CHUNK_SIZE}
ingestion.et-rss-feeds[0]=${INGESTION_ET_RSS_FEEDS_0}
ingestion.et-rss-feeds[1]=${INGESTION_ET_RSS_FEEDS_1}
rag.top-k=${RAG_TOP_K}
rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD}
advisor.cache-ttl-ms=${ADVISOR_CACHE_TTL_MS}
advisor.max-concurrency=${ADVISOR_MAX_CONCURRENCY}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE}
